name: Upstox Token Exchange

on:
  workflow_dispatch:
    inputs:
      code:
        description: 'Authorization code from Upstox redirect URL'
        required: true

jobs:
  exchange:
    runs-on: ubuntu-latest
    steps:
      - name: Exchange authorization code for access token
        env:
          API_KEY: ${{ secrets.UPSTOX_API_KEY }}
          API_SECRET: ${{ secrets.UPSTOX_API_SECRET }}
          AUTH_CODE: ${{ github.event.inputs.code }}
        run: |
          RESPONSE=$(curl -s -X POST https://api.upstox.com/v2/login/authorization/token \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "Accept: application/json" \
            --data-urlencode "code=${AUTH_CODE}" \
            --data-urlencode "client_id=${API_KEY}" \
            --data-urlencode "client_secret=${API_SECRET}" \
            --data-urlencode "redirect_uri=https://127.0.0.1" \
            --data-urlencode "grant_type=authorization_code")
          
          STATUS=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print('SUCCESS' if 'access_token' in d else 'FAIL')" 2>/dev/null || echo "FAIL")
          
          if [ "$STATUS" = "SUCCESS" ]; then
            # Use sys.stdout.write to avoid trailing newline
            echo "$RESPONSE" | python3 -c "import sys,json; sys.stdout.write(json.load(sys.stdin)['access_token'])" > token.txt
            # Verify no trailing whitespace
            BYTES=$(wc -c < token.txt)
            echo "Token saved. Length: ${BYTES} bytes (no trailing newline)."
            echo "Download the artifact below to retrieve it."
          else
            echo "FAILED to get token. Response from Upstox:"
            echo "$RESPONSE"
            exit 1
          fi
      
      - name: Upload token as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: upstox-token
          path: token.txt
          retention-days: 1
