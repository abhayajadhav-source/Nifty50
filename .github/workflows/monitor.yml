name: Nifty50 Vikram Strategy Monitor

on:
  schedule:
    - cron: '*/5 3-10 * * 1-5'
  workflow_dispatch:
    inputs:
      mock_mode:
        description: 'Run with synthetic data?'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Restore alert state
        uses: actions/cache@v4
        with:
          path: alerted_today.json
          key: alert-state-v13-${{ github.run_id }}
          restore-keys: alert-state-v13-
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          MOCK_MODE: ${{ github.event.inputs.mock_mode || 'false' }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python src/main.py
      
      - name: Commit dashboard update
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          git diff --quiet --cached || git commit -m "Update dashboard $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
          git push
        continue-on-error: true
