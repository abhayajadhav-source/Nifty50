name: Nifty50 Vikram Strategy Monitor

on:
  schedule:
    - cron: '*/5 3-10 * * 1-5'
  workflow_dispatch:
    inputs:
      mock_mode:
        description: 'Run with synthetic data?'
        type: boolean
        default: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Restore alert state
        uses: actions/cache@v4
        with:
          path: alerted_today.json
          key: alert-state-v10-${{ github.run_id }}
          restore-keys: alert-state-v10-
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
          MOCK_MODE: ${{ github.event.inputs.mock_mode || 'false' }}
        run: python src/main.py
