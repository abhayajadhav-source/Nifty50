name: Nifty50 Gap Monitor

on:
  schedule:
    - cron: '*/5 3-10 * * 1-5'
  workflow_dispatch:
    inputs:
      mock_mode:
        description: 'Run with synthetic data?'
        type: boolean
        default: false
      manual_report:
        description: 'Generate downloadable analyst report?'
        type: boolean
        default: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Restore alert state
        uses: actions/cache@v4
        with:
          path: alerted_today.json
          key: alert-state-v9-${{ github.run_id }}
          restore-keys: alert-state-v9-
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          MOCK_MODE: ${{ github.event.inputs.mock_mode || 'false' }}
          MANUAL_RUN: ${{ github.event.inputs.manual_report || 'false' }}
        run: python src/main.py
      
      - name: Upload report
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.manual_report == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scan-report
          path: scan_report.html
          retention-days: 7
